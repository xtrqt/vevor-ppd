name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: install deps
      run: sudo apt-get install libcups2-dev libcupsimage2-dev
    - name: make
      run: make
    - uses: actions/upload-artifact@v4
      with:
          name: dist-without-markdown
          path: |
            rastertolabel
            Vevor\ Label\ Printer\ 300.ppd
    
