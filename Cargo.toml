[package]
name = "vevor-printer-app"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["macros"] }
clap = { version = "4.5", features = ["derive", "env"] }
mdns-sd = "0.11"
tokio = { version = "1.38", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
print_raster = "0.1"
futures = "0.3"
tokio-util = { version = "0.7", features = ["compat"] }
bytes = "1.0"
dotenvy = "0.15"
config = "0.14"

[dev-dependencies]
tempfile = "3.10"

